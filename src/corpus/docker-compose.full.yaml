# Full-run testbed: VAmPI behind its own capture proxy, plus a second capture proxy in front
# of the already-running crAPI, reached through the host-published port. All generators run as
# one-shot containers on corpus_net with distinct static IPs. See run_full.sh.

networks:
  corpus_net:
    name: corpus_net
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  vampi:
    image: erev0s/vampi@sha256:0a5a224b6e14ae7da6a6ea265178ff71286ff903aec74adee98f660bb0e4ca12
    networks:
      corpus_net:
        ipv4_address: 172.30.0.2
    expose: ["5000"]

  proxy-vampi:
    image: mitmproxy/mitmproxy@sha256:00b77b5d8804c8ad18cb6caefbf9d5849e895e8986c5ce011f4ae30f4385962f
    depends_on: [vampi]
    command: >
      mitmdump --mode reverse:http://172.30.0.2:5000
      --listen-host 0.0.0.0 --listen-port 8080
      --set block_global=false --set connection_strategy=lazy
      -s /addon/capture_addon.py
      --set capture_out=/out/raw/vampi_full.jsonl
      --set capture_app=vampi --set capture_run=${RUN_ID:-full}
    volumes:
      - ./mitm_addon:/addon:ro
      - ../../data/corpus:/out
    networks:
      corpus_net:
        ipv4_address: 172.30.0.3

  proxy-crapi:
    image: mitmproxy/mitmproxy@sha256:00b77b5d8804c8ad18cb6caefbf9d5849e895e8986c5ce011f4ae30f4385962f
    command: >
      mitmdump --mode reverse:http://host.docker.internal:8888
      --listen-host 0.0.0.0 --listen-port 8081
      --set block_global=false --set connection_strategy=lazy
      -s /addon/capture_addon.py
      --set capture_out=/out/raw/crapi_full.jsonl
      --set capture_app=crapi --set capture_run=${RUN_ID:-full}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./mitm_addon:/addon:ro
      - ../../data/corpus:/out
    networks:
      corpus_net:
        ipv4_address: 172.30.0.4
