# Smoke-run testbed: VAmPI behind a mitmproxy reverse proxy that captures every flow. All app
# traffic, benign and attack, goes through the proxy so schema and timing are uniform.
# Generators are not services here. They run as one-shot containers on the corpus_net network
# with distinct static IPs, described in run_smoke.sh, which is what gives each role a distinct
# source IP for provenance labeling.

networks:
  corpus_net:
    name: corpus_net
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  vampi:
    image: erev0s/vampi@sha256:0a5a224b6e14ae7da6a6ea265178ff71286ff903aec74adee98f660bb0e4ca12
    networks:
      corpus_net:
        ipv4_address: 172.30.0.2
    expose:
      - "5000"

  proxy:
    image: mitmproxy/mitmproxy@sha256:00b77b5d8804c8ad18cb6caefbf9d5849e895e8986c5ce011f4ae30f4385962f
    depends_on:
      - vampi
    command: >
      mitmdump
      --mode reverse:http://172.30.0.2:5000
      --listen-host 0.0.0.0 --listen-port 8080
      --set block_global=false
      --set connection_strategy=lazy
      -s /addon/capture_addon.py
      --set capture_out=/out/raw/vampi_smoke.jsonl
      --set capture_app=vampi
      --set capture_run=${RUN_ID:-smoke}
    volumes:
      - ./mitm_addon:/addon:ro
      - ../../data/corpus_smoke:/out
    networks:
      corpus_net:
        ipv4_address: 172.30.0.3
    ports:
      - "127.0.0.1:8080:8080"
